# =====================================================================
# CREDENTIALS VIA ENVIRONMENT VARIABLES — safe to commit.
#
# Every value here is a ${VAR} reference, resolved from the environment
# at startup, so no secret is ever written to disk or pasted into a
# chat. Use this instead of config/credentials.toml when the secrets
# live in your cloud environment's settings (Network secrets / env
# vars) rather than in a local file.
#
#   CREDENTIALS=config/credentials.env.toml ./run-monitor.sh
#
# Set these five variables in the environment:
#
#   FACEBOOK_USERNAME     your Facebook account email
#   FACEBOOK_PASSWORD     your Facebook password
#   PUSHOVER_USER_KEY     from the Pushover dashboard
#   PUSHOVER_API_TOKEN    Pushover -> Create an Application/API Token
#   ANTHROPIC_API_KEY     https://console.anthropic.com -> API Keys
#
# run-monitor.sh refuses to start if any of them is unset. That check
# matters because the failures are not all loud: a missing Anthropic
# key raises at startup, but missing Pushover keys do not — the monitor
# would run, match listings and silently never notify you.
# =====================================================================

[marketplace.facebook]
username = '${FACEBOOK_USERNAME}'
password = '${FACEBOOK_PASSWORD}'

[user.me]
pushover_user_key = '${PUSHOVER_USER_KEY}'
pushover_api_token = '${PUSHOVER_API_TOKEN}'
# Include the first 200 characters of the listing description in each push.
with_description = 200

[ai.anthropic]
api_key = '${ANTHROPIC_API_KEY}'
model = 'claude-sonnet-5-5'
