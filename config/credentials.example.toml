# =====================================================================
# CREDENTIALS TEMPLATE — copy to config/credentials.toml (gitignored)
# and fill in the three REPLACE_ME blocks below. Never commit the copy.
#
#   cp config/credentials.example.toml config/credentials.toml
# =====================================================================

[marketplace.facebook]
# Your normal Facebook login. Where to get it: it's just your Facebook
# account email + password. If you use 2FA you'll approve the login in
# the browser window on first run; the session is then cached.
# Alternative: leave these out and set the FACEBOOK_USERNAME and
# FACEBOOK_PASSWORD environment variables instead.
username = 'REPLACE_ME_FACEBOOK_EMAIL'
password = 'REPLACE_ME_FACEBOOK_PASSWORD'

[user.me]
# Pushover (phone push notifications):
# 1. Install the Pushover app on your phone (30-day free trial, then a
#    one-time $5 per platform).
# 2. Create an account at https://pushover.net — your User Key is shown
#    on the dashboard as "Your User Key".
# 3. On the same dashboard, "Create an Application/API Token" (name it
#    e.g. AIMarketplaceMonitor) — that gives you the API Token.
pushover_user_key = 'REPLACE_ME_PUSHOVER_USER_KEY'
pushover_api_token = 'REPLACE_ME_PUSHOVER_API_TOKEN'
# Include the first 200 characters of the listing description in each push.
with_description = 200

[ai.anthropic]
# Needed ONLY for the Tier 2 broad search (AI evaluation of listings).
# Get a key at https://console.anthropic.com -> API Keys. Starts 'sk-ant-'.
# If you skip this, delete this section AND the [item.steel_drop_bar]
# block in bikes.toml. The AI gate fails OPEN (see the warning above that
# block), so an absent or broken key does not make Tier 2 go quiet — it
# makes every listing in the $700-2200 band notify.
api_key = 'REPLACE_ME_ANTHROPIC_API_KEY'
# Keep this set. Omitting it falls back to the built-in default of
# ai-marketplace-monitor 0.10.2, claude-sonnet-4-20250514, which is
# several generations old.
model = 'claude-sonnet-5-5'
